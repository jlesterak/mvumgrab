name: publish

# Publishes ghcr.io/<owner>/mvumgrab. RELEASES ONLY: built when a version tag (v1.2.3) is pushed, never on an
# ordinary commit. Tags for v1.2.3: :1.2.3 (pin this), :latest, :sha-abc1234. A manual run builds only :sha-.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"
          sha=$(git rev-parse --short HEAD)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            git_version="${GITHUB_REF_NAME#v}"
            file_version=$(python3 -c "import mvum; print(mvum.__version__)")
            if [ "$git_version" != "$file_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${file_version} in mvum/__init__.py"
              exit 1
            fi
            tags="${image}:${git_version}"$'\n'"${image}:latest"$'\n'"${image}:sha-${sha}"
          else
            tags="${image}:sha-${sha}"
          fi
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: it runs on icebox. GDAL's image is ~2 GB, so cache layers between runs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
